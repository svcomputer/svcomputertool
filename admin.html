<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SV Tool - Admin Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 40px 5%;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-title {
            font-size: 1.8rem;
            color: var(--text-light);
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        .admin-title span {
            color: var(--accent-gold);
        }

        .back-home-btn {
            background-color: var(--accent-blue);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card .num {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow-x: auto;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px;
        }

        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #111827;
            color: var(--text-light);
            font-weight: 600;
        }

        tr:hover {
            background-color: #243249;
        }

        td {
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
        }

        .action-controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .clear-btn {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .clear-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1 class="admin-title">SV TECH — <span>Admin Panel</span></h1>
        <a href="index.html" class="back-home-btn">⬅ Back to Tool Dashboard</a>
    </header>

    <section class="stats-grid">
        <div class="stat-card">
            <h3>Total NSDL Applications</h3>
            <div class="num" id="totalCount">0</div>
        </div>
    </section>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Full Name</th>
                    <th>Mobile Number</th>
                    <th>Email ID</th>
                    <th>Address</th>
                    <th>Aadhaar Number</th>
                    <th>PAN Number</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr>
                    <td colspan="7" class="no-data">Loading application datasets...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="action-controls">
        <button class="clear-btn" onclick="clearAllData()">Clear All Records</button>
    </div>

    <script>
        // System Data Loading Matrix Initialization
        document.addEventListener('DOMContentLoaded', function() {
            loadApplicationData();
        });

        function loadApplicationData() {
            const tableBody = document.getElementById('adminTableBody');
            const totalCountEl = document.getElementById('totalCount');
            
            // LocalStorage gateway array parsing
            let applications = JSON.parse(localStorage.getItem('nsdl_applications')) || [];
            
            // Counter update mechanism
            totalCountEl.textContent = applications.length;

            if (applications.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="no-data">No NSDL PAN Agency applications found registered.</td>
                    </tr>
                `;
                return;
            }

            // HTML injection logic building database matrix
            tableBody.innerHTML = '';
            applications.forEach((app, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${escapeHtml(app.name)}</strong></td>
                    <td>${escapeHtml(app.mobile)}</td>
                    <td>${escapeHtml(app.email)}</td>
                    <td>${escapeHtml(app.address)}</td>
                    <td><code>${escapeHtml(app.aadhaar)}</code></td>
                    <td><code>${escapeHtml(app.pan)}</code></td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Data Cleansing Protocol Configuration
        function clearAllData() {
            if (confirm('Are you absolutely sure you want to completely erase all registered records? This action cannot be undone.')) {
                localStorage.removeItem('nsdl_applications');
                loadApplicationData();
                alert('Dataset records cleared successfully.');
            }
        }

        // Cross-site XSS security framework sanitization layer
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
